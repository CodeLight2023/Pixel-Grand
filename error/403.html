<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>403 - Forbidden | Pixel Grand Tech Hub</title>

    <link rel="icon" type="image/png" href="img/Logo3.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:'Poppins', sans-serif;
            background:#111827;
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            text-align:center;
            padding:20px;
        }

        .box{
            max-width:650px;
        }

        h1{
            font-size:7rem;
            color:#f59e0b;
            margin-bottom:10px;
        }

        p{
            color:#d1d5db;
            line-height:1.7;
        }

        a{
            display:inline-block;
            margin-top:30px;
            padding:14px 35px;
            background:#f59e0b;
            color:#000;
            text-decoration:none;
            border-radius:40px;
            font-weight:600;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>403</h1>
    <h2>Access Forbidden</h2>

    <p>
        You do not have permission to access this resource.
    </p>

    <a href="/">Return Home</a>
</div>

</body>
</html>
